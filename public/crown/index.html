<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Crown Network | AWE Holdings</title>
<style>
:root{--gold:#d8ac4e;--gold2:#f1d783;--ink:#070707;--text:#f7f4ec;--muted:#8f897e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 35%,#1b1408 0,#090806 28%,#050505 62%,#020202 100%);color:var(--text);font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}
body:before{content:"";position:fixed;inset:0;opacity:.16;background-image:linear-gradient(rgba(216,172,78,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(216,172,78,.12) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(circle,#000,transparent 75%)}
.chamber{position:relative;width:min(920px,90vw);padding:72px 34px;text-align:center;border:1px solid rgba(216,172,78,.24);background:rgba(5,5,4,.72);box-shadow:0 0 90px rgba(216,172,78,.08),inset 0 0 70px rgba(216,172,78,.025)}
.crown{font-size:42px;color:var(--gold2);filter:drop-shadow(0 0 18px rgba(241,215,131,.25))}
.kicker{margin:22px 0 12px;color:var(--gold);font-size:11px;letter-spacing:.34em;font-weight:800}
h1{font:600 clamp(44px,7vw,84px)/.9 Georgia,serif;margin:0;letter-spacing:-.045em}
h1 span{color:var(--gold2)}
.copy{max-width:620px;margin:26px auto 0;color:var(--muted);line-height:1.7;font-size:14px}
.status{margin:42px auto 0;width:max-content;max-width:100%;padding:12px 18px;border:1px solid rgba(216,172,78,.2);color:#b7aa8d;font:700 10px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em}
@media(max-width:600px){.chamber{padding:54px 22px}.status{letter-spacing:.1em}}
</style>
</head>
<body>
<main class="chamber">
<div class="crown" aria-hidden="true">♛</div>
<p class="kicker">CROWN NETWORK · AUTHORIZED SESSION</p>
<h1>WEAR YOUR CROWN<br><span>PROUDLY.</span></h1>
<p class="copy">The gate recognized your Crown Identity. This is the first protected chamber of the AWE Crown Network. Houses, permissions and member experiences will open from here according to your access.</p>
<p class="status">CROWN HOUSE // ACCESS GRANTED</p>
</main>
</body>
</html>
