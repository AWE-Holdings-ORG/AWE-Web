name: Player Access Tests

on:
  push:
    paths:
      - "lib/player-access.js"
      - "lib/player-viewer-context.js"
      - "lib/player-catalog-service.js"
      - "lib/player-api.js"
      - "lib/player-analytics.js"
      - "worker-entry.js"
      - "public/crown/crowd/level-x/index.html"
      - "public/crown/crowd/level-x/analytics/index.html"
      - "package.json"
      - "migrations/0009_player_access_states.sql"
      - "migrations/0010_player_access_grants.sql"
      - "migrations/0011_player_engagement_analytics.sql"
      - "migrations/0012_x_tha_god_crowd_owned_battles.sql"
      - "tests/player-access.test.mjs"
      - "tests/player-migrations.test.py"
      - "tests/level-x-seed.test.py"
      - "tests/preview-security-cleanup.test.mjs"
      - "tests/level-x-client.test.mjs"
      - "tests/player-analytics.test.mjs"
      - "tests/player-analytics-migration.test.py"
      - "SCRYPTUREZ/CROWN/SCRYPT-CROWN-001-PLAYER-ACCESS-LAW.md"
      - "SCRYPTUREZ/CROWN/SCRYPT-CROWN-002-PLAYER-ACCESS-RESOLVER.md"
      - "SCRYPTUREZ/CROWN/SCRYPT-CROWN-004-PLAYER-PREVIEW-PROMOTION.md"
      - "SCRYPTUREZ/CROWN/SCRYPT-CROWN-006-PLAYER-QUALIFIED-VIEWS.md"
      - "SCRYPTUREZ/CROWN/SCRYPT-CROWN-007-PLAYER-ENGAGEMENT-ANALYTICS.md"
      - ".github/workflows/player-access-tests.yml"
  pull_request:
    paths:
      - "lib/player-access.js"
      - "lib/player-viewer-context.js"
      - "lib/player-catalog-service.js"
      - "lib/player-api.js"
      - "lib/player-analytics.js"
      - "worker-entry.js"
      - "public/crown/crowd/level-x/index.html"
      - "public/crown/crowd/level-x/analytics/index.html"
      - "package.json"
      - "migrations/0009_player_access_states.sql"
      - "migrations/0010_player_access_grants.sql"
      - "migrations/0011_player_engagement_analytics.sql"
      - "migrations/0012_x_tha_god_crowd_owned_battles.sql"
      - "tests/player-access.test.mjs"
      - "tests/player-migrations.test.py"
      - "tests/level-x-seed.test.py"
      - "tests/preview-security-cleanup.test.mjs"
      - "tests/level-x-client.test.mjs"
      - "tests/player-analytics.test.mjs"
      - "tests/player-analytics-migration.test.py"
      - "SCRYPTUREZ/CROWN/**"
      - ".github/workflows/player-access-tests.yml"

permissions:
  contents: read

jobs:
  player-access:
    name: SCRYPT-CROWN-002 access gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Player runtime syntax
        run: npm run check:player-runtime

      - name: Run Player access resolver tests
        run: npm run test:player-access

      - name: Validate Player access migrations
        run: python tests/player-migrations.test.py

      - name: Validate LEVEL X verified battle seed
        run: npm run test:level-x-seed

      - name: Validate LEVEL X client playback wiring
        run: npm run test:level-x-client

      - name: Run Player analytics service tests
        run: npm run test:player-analytics

      - name: Validate Player analytics migration
        run: npm run test:player-analytics-migration

      - name: Prevent retired Preview recovery regression
        run: npm run test:preview-security
