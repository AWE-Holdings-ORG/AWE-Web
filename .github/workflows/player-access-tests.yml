permissions:
  contents: read

jobs:
  player-access:
    name: SCRYPT-CROWN-002 access gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Player runtime syntax
        run: npm run check:player-runtime

      - name: Run Player access resolver tests
        run: npm run test:player-access

      - name: Validate Player access migrations
        run: python tests/player-migrations.test.py

      - name: Validate LEVEL X verified battle seed
        run: npm run test:level-x-seed

      - name: Validate LEVEL X client playback wiring
        run: npm run test:level-x-client

      - name: Run Player analytics service tests
        run: npm run test:player-analytics

      - name: Validate Player analytics migration
        run: npm run test:player-analytics-migration

      - name: Validate Player event context migration
        run: npm run test:player-event-context-migration

      - name: Validate reconciled X external event context
        run: npm run test:x-external-event-context-migration

      - name: Validate X reconciled additions
        run: npm run test:x-reconciled-additions-migration

      - name: Validate Tha X Filez collection migration
        run: npm run test:player-media-collections-migration

      - name: Validate public Tha X Filez surface
        run: npm run test:player-public-surface

      - name: Validate Da Archivez architecture
        run: npm run test:archivez-client

      - name: Validate initial Tha X Filez image seed
        run: npm run test:tha-x-filez-images-migration

      - name: Prevent retired Preview recovery regression
        run: npm run test:preview-security
